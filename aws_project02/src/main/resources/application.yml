server:
  port: 9090

spring:
  application:
    name: aws_project02
  datasource:
    url: jdbc:mariadb://localhost:3306/aws_project02?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info

aws:
  region: us-east-1
  sns:
    topic:
      product:
        events:
          arn: product-events
