spring:
  application:
    name: aws_project01
  datasource:
    url: jdbc:mariadb://localhost:3306/aws_project01?createDatabaseIfNotExist=true
    username: root
    password:
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info

aws:
  region: us-east-1
  s3:
    bucket:
      invoice:
        name: pcs01-braulio-invoice
  sqs:
    queue:
      invoice:
        events:
          name: s3-invoice-events
  sns:
    topic:
      product:
        events:
          arn: product-events